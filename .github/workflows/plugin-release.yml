---
name: Plugin Release

on:
  workflow_dispatch:

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Verify plugin is in sync
        run: |
          scripts/sync-plugin.sh
          if ! git diff --quiet plugin/; then
            echo "plugin/ is out of sync — run sync-plugin.sh locally, commit, and push before releasing." >&2
            git diff plugin/
            exit 1
          fi

      - name: Strip -dev and set release version
        run: |
          current=$(jq -r '.version' plugin/.claude-plugin/plugin.json)
          release_version="${current%%-*}"
          echo "release_version=$release_version" >> "$GITHUB_ENV"
          manifest="plugin/.claude-plugin/plugin.json"
          jq --arg v "$release_version" '.version = $v' "$manifest" > "$manifest.tmp"
          mv "$manifest.tmp" "$manifest"

      - name: Sync plugin directory
        run: scripts/sync-plugin.sh

      - name: Commit release and tag
        run: |
          git add plugin/
          git commit -m "release: v${{ env.release_version }}"
          git tag "v${{ env.release_version }}"
          git push origin main --tags
